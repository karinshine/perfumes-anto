name: Publicar en Firebase (antoperfumes.web.app)
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Publicar
        env:
          KEY: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          if [ -z "$KEY" ]; then echo "Falta el secreto FIREBASE_SERVICE_ACCOUNT"; exit 0; fi
          printf '%s' "$KEY" > "$RUNNER_TEMP/key.json"
          if ! PROJECT=$(jq -er .project_id "$RUNNER_TEMP/key.json"); then
            echo "::error::La llave no es un JSON válido de cuenta de servicio"; exit 1
          fi
          echo "::notice::Proyecto Firebase: $PROJECT"
          export GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/key.json"
          set +e
          # Sitio con nombre corto (antoperfumes.web.app); si no se puede, queda el del proyecto
          SITE=antoperfumes
          npx -y firebase-tools@latest hosting:sites:get "$SITE" --project "$PROJECT" > /dev/null 2>&1 \
            || npx -y firebase-tools@latest hosting:sites:create "$SITE" --project "$PROJECT" --non-interactive > site.txt 2>&1
          if npx -y firebase-tools@latest hosting:sites:get "$SITE" --project "$PROJECT" > /dev/null 2>&1; then
            jq --arg s "$SITE" '.hosting.site=$s' firebase.json > f.json && mv f.json firebase.json
            npx -y firebase-tools@latest deploy --only hosting --project "$PROJECT" --non-interactive >> out.txt 2>&1
            jq 'del(.hosting.site)' firebase.json > f.json && mv f.json firebase.json
          else
            echo "::warning::No se pudo crear $SITE.web.app: $(tail -3 site.txt | tr '\n' ' ')"
          fi
          npx -y firebase-tools@latest deploy --only hosting --project "$PROJECT" --non-interactive >> out.txt 2>&1
          code=$?
          cat out.txt
          if [ $code -ne 0 ]; then
            msg=$(grep -iE "error|denied|not found|permission|enable|site" out.txt | tail -6 | tr '\n' ' ')
            echo "::error::$msg"
            exit $code
          fi
          echo "::notice::$(grep -i 'Hosting URL' out.txt | tr '\n' ' ')"
